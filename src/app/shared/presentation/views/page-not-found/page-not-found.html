<div class="not-found-container">
  <mat-icon class="not-found-icon">error_outline</mat-icon>
  <h1 class="not-found-title">{{ 'page-not-found.title' | translate }}</h1>
  <p class="not-found-message" [innerHTML]="'page-not-found.content' | translate: { invalid_path: '<code>' + invalidPath + '</code>' }"></p>
  <button class="home-button" (click)="navigateToHome()">
    <mat-icon>home</mat-icon>
    <span>{{ 'page-not-found.go-home' | translate }}</span>
  </button>
</div>
