<div class="language-switcher">
  <div
    class="lang-group"
    [class.es-active]="currentLanguage === 'es'"
  >
    @for (lang of languages; track lang.code) {
      <button
        class="lang-toggle"
        [class.active]="currentLanguage === lang.code"
        (click)="useLanguage(lang.code)"
      >
        {{ lang.flag }}
      </button>
    }
  </div>
</div>
