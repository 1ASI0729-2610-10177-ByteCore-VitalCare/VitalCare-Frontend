<main class="main-content">
  <div class="title-container">
    <h1 class="page-title">Notificaciones</h1>
  </div>

  <div class="table-container">
    <table class="notifications-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Fecha</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (notification of notifications(); track notification.id) {
          <tr [class.clickable-row]="notification.patientId != null" (click)="goToPatient(notification.patientId)">
            <td>{{ notification.nombre }}</td>
            <td>{{ notification.fecha }}</td>
            <td>
              <button mat-raised-button color="primary" (click)="$event.stopPropagation(); showDescription(notification.descripcion)">
                VER DESCRIPCIÓN
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  @if (selectedDescription()) {
    <div class="description-overlay">
      <div class="description-card">
        <h3>Descripción</h3>
        <p>{{ selectedDescription() }}</p>
        <button mat-button (click)="selectedDescription.set(null)">CERRAR</button>
      </div>
    </div>
  }

  <div class="actions-container">
    <button mat-raised-button color="primary" class="back-button" (click)="goBack()">
      REGRESAR
    </button>
  </div>
</main>

<footer class="footer-bar">
  <div class="footer-left">
    <button mat-icon-button matTooltip="Accesibilidad" class="accessibility-btn">
      <mat-icon>accessibility_new</mat-icon>
    </button>
  </div>
  <div class="footer-right">
    <button mat-icon-button matTooltip="Configuración" class="settings-btn">
      <mat-icon>settings</mat-icon>
    </button>
  </div>
</footer>
